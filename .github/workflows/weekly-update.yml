name: Update Schedule (Manual + Auto)

on:
  schedule:
    - cron: '0 9 * * 0'  # Sunday 9AM UTC
  workflow_dispatch:
    inputs:
      mon:
        description: 'Monday (Mon)'
        required: false
        default: 'CLOSED'
        type: choice
        options: ['OPEN', 'CLOSED']
      tue:
        description: 'Tuesday (Tue): status'
        required: false
        default: 'OPEN'
        type: choice
        options: ['OPEN', 'CLOSED']
      wed:
        description: 'Wednesday (Wed)'
        required: false
        default: 'OPEN'
        type: choice
        options: ['OPEN', 'CLOSED']
      thu:
        description: 'Thursday (Thu)'
        required: false
        default: 'OPEN'
        type: choice
        options: ['OPEN', 'CLOSED']
      fri:
        description: 'Friday (Fri)'
        required: false
        default: 'CLOSED'
        type: choice
        options: ['OPEN', 'CLOSED']
      sat:
        description: 'Saturday (Sat)'
        required: false
        default: 'OPEN'
        type: choice
        options: ['OPEN', 'CLOSED']
      sun:
        description: 'Sunday (Sun)'
        required: false
        default: 'OPEN'
        type: choice
        options: ['OPEN', 'CLOSED']

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set overrides from inputs
        run: |
          OVERRIDES="{}"
          if [ "${{ github.event.inputs.tue }}" != "OPEN" ]; then
            OVERRIDES=$(jq --arg date "$(date -d 'tuesday' '+%Y-%m-%d')" --arg status "${{ github.event.inputs.tue }}" '$OVERRIDES + {($date): $status}' <<< "$OVERRIDES")
          fi
          # Repeat for wed, thu, sat, sun...
          echo "$OVERRIDES" | jq > schedule.json

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📅 Schedule update"
