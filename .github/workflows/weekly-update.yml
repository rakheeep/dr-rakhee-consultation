name: Update Schedule (Manual + Auto)

on:
  schedule:
    - cron: '0 9 * * 0'  # Sunday 9AM UTC
  workflow_dispatch:
    inputs:
      mon:
        description: 'Monday (Mon)'
        required: false
        default: 'DEFAULT'
        type: choice
        options: ['DEFAULT', 'OPEN', 'CLOSED']
      tue:
        description: 'Tuesday (Tue)'
        required: false
        default: 'DEFAULT'
        type: choice
        options: ['DEFAULT', 'OPEN', 'CLOSED']
      wed:
        description: 'Wednesday (Wed)'
        required: false
        default: 'DEFAULT'
        type: choice
        options: ['DEFAULT', 'OPEN', 'CLOSED']
      thu:
        description: 'Thursday (Thu)'
        required: false
        default: 'DEFAULT'
        type: choice
        options: ['DEFAULT', 'OPEN', 'CLOSED']
      fri:
        description: 'Friday (Fri)'
        required: false
        default: 'DEFAULT'
        type: choice
        options: ['DEFAULT', 'OPEN', 'CLOSED']
      sat:
        description: 'Saturday (Sat)'
        required: false
        default: 'DEFAULT'
        type: choice
        options: ['DEFAULT', 'OPEN', 'CLOSED']
      sun:
        description: 'Sunday (Sun)'
        required: false
        default: 'DEFAULT'
        type: choice
        options: ['DEFAULT', 'OPEN', 'CLOSED']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build schedule overrides
        run: |
          # Get the current week's Sunday as reference
          WEEK_START=$(date -d "sunday" '+%Y-%m-%d')

          # Initialize empty overrides
          OVERRIDES="{}"

          # Process each day if not DEFAULT
          # Monday
          if [ "${{ github.event.inputs.mon }}" != "DEFAULT" ] && [ -n "${{ github.event.inputs.mon }}" ]; then
            MON_DATE=$(date -d "monday" '+%Y-%m-%d')
            OVERRIDES=$(echo "$OVERRIDES" | jq --arg date "$MON_DATE" --arg status "${{ github.event.inputs.mon }}" '. + {($date): $status}')
          fi

          # Tuesday
          if [ "${{ github.event.inputs.tue }}" != "DEFAULT" ] && [ -n "${{ github.event.inputs.tue }}" ]; then
            TUE_DATE=$(date -d "tuesday" '+%Y-%m-%d')
            OVERRIDES=$(echo "$OVERRIDES" | jq --arg date "$TUE_DATE" --arg status "${{ github.event.inputs.tue }}" '. + {($date): $status}')
          fi

          # Wednesday
          if [ "${{ github.event.inputs.wed }}" != "DEFAULT" ] && [ -n "${{ github.event.inputs.wed }}" ]; then
            WED_DATE=$(date -d "wednesday" '+%Y-%m-%d')
            OVERRIDES=$(echo "$OVERRIDES" | jq --arg date "$WED_DATE" --arg status "${{ github.event.inputs.wed }}" '. + {($date): $status}')
          fi

          # Thursday
          if [ "${{ github.event.inputs.thu }}" != "DEFAULT" ] && [ -n "${{ github.event.inputs.thu }}" ]; then
            THU_DATE=$(date -d "thursday" '+%Y-%m-%d')
            OVERRIDES=$(echo "$OVERRIDES" | jq --arg date "$THU_DATE" --arg status "${{ github.event.inputs.thu }}" '. + {($date): $status}')
          fi

          # Friday
          if [ "${{ github.event.inputs.fri }}" != "DEFAULT" ] && [ -n "${{ github.event.inputs.fri }}" ]; then
            FRI_DATE=$(date -d "friday" '+%Y-%m-%d')
            OVERRIDES=$(echo "$OVERRIDES" | jq --arg date "$FRI_DATE" --arg status "${{ github.event.inputs.fri }}" '. + {($date): $status}')
          fi

          # Saturday
          if [ "${{ github.event.inputs.sat }}" != "DEFAULT" ] && [ -n "${{ github.event.inputs.sat }}" ]; then
            SAT_DATE=$(date -d "saturday" '+%Y-%m-%d')
            OVERRIDES=$(echo "$OVERRIDES" | jq --arg date "$SAT_DATE" --arg status "${{ github.event.inputs.sat }}" '. + {($date): $status}')
          fi

          # Sunday
          if [ "${{ github.event.inputs.sun }}" != "DEFAULT" ] && [ -n "${{ github.event.inputs.sun }}" ]; then
            SUN_DATE=$(date -d "sunday" '+%Y-%m-%d')
            OVERRIDES=$(echo "$OVERRIDES" | jq --arg date "$SUN_DATE" --arg status "${{ github.event.inputs.sun }}" '. + {($date): $status}')
          fi

          # Create docs/schedule.json
          mkdir -p docs
          TODAY=$(date '+%Y-%m-%d')
          jq -n --argjson overrides "$OVERRIDES" --arg updated "$TODAY" '{overrides: $overrides, last_updated: $updated}' > docs/schedule.json
          
          echo "Generated docs/schedule.json:"
          cat docs/schedule.json

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📅 Schedule update for week of $(date '+%Y-%m-%d')"
          file_pattern: docs/schedule.json
